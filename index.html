<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoiceTasks</title>
<meta name="description" content="A simple offline task planner with optional voice input in Russian, Ukrainian and English.">
<meta name="theme-color" content="#f6f3ec">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">VoiceTasks</span>
    </div>
    <div class="header-controls">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="uk">UA</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <button type="button" id="importExportBtn" class="icon-btn" title="Import / Export" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div id="offlineBanner" class="banner banner-offline" hidden></div>
  <div id="speechBanner" class="banner banner-warn" hidden></div>

  <main class="app-main">

    <form id="taskForm" class="task-form" autocomplete="off">
      <input
        id="taskInput"
        class="task-input"
        type="text"
        name="taskText"
        maxlength="500"
        inputmode="text"
      />
      <button type="button" id="micBtn" class="mic-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="currentColor"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="mic-pulse" aria-hidden="true"></span>
      </button>
      <button type="submit" id="addBtn" class="add-btn"></button>
    </form>

    <div id="parsePreview" class="parse-preview" hidden></div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab-btn is-active" id="tabActiveBtn" role="tab" aria-selected="true">
        <span class="tab-label"></span><span class="tab-count" id="activeCount">0</span>
      </button>
      <button type="button" class="tab-btn" id="tabCompletedBtn" role="tab" aria-selected="false">
        <span class="tab-label"></span><span class="tab-count" id="completedCount">0</span>
      </button>
    </nav>

    <section id="listActive" class="task-list" role="tabpanel"></section>
    <section id="listCompleted" class="task-list" role="tabpanel" hidden></section>

  </main>

  <footer class="app-footer">
    <span id="footerNote"></span>
  </footer>
</div>

<!-- Edit modal -->
<dialog id="editModal" class="modal">
  <form method="dialog" id="editForm" class="modal-form">
    <h2 id="editModalTitle"></h2>
    <label class="field-label" for="editText"></label>
    <textarea id="editText" class="field-textarea" maxlength="500" rows="3"></textarea>
    <div class="field-row">
      <div>
        <label class="field-label" for="editDate"></label>
        <input type="date" id="editDate" class="field-input">
      </div>
      <div>
        <label class="field-label" for="editTime"></label>
        <input type="time" id="editTime" class="field-input">
      </div>
    </div>
    <button type="button" id="editClearDateTime" class="link-btn"></button>
    <div class="modal-actions">
      <button type="button" id="editCancelBtn" class="btn btn-ghost"></button>
      <button type="submit" id="editSaveBtn" class="btn btn-primary"></button>
    </div>
  </form>
</dialog>

<!-- Delete confirmation modal -->
<dialog id="deleteModal" class="modal">
  <div class="modal-form">
    <h2 id="deleteModalTitle"></h2>
    <p id="deleteModalBody" class="modal-body-text"></p>
    <div class="modal-actions">
      <button type="button" id="deleteCancelBtn" class="btn btn-ghost"></button>
      <button type="button" id="deleteConfirmBtn" class="btn btn-danger"></button>
    </div>
  </div>
</dialog>

<!-- Import / Export modal -->
<dialog id="ieModal" class="modal">
  <div class="modal-form">
    <h2 id="ieModalTitle"></h2>
    <button type="button" id="exportBtn" class="btn btn-primary btn-block"></button>
    <hr class="modal-divider">
    <label class="field-label" for="importFile"></label>
    <input type="file" id="importFile" accept="application/json,.json" class="field-input">
    <div class="import-mode-row">
      <label><input type="radio" name="importMode" value="merge" checked> <span id="importModeMergeLabel"></span></label>
      <label><input type="radio" name="importMode" value="replace"> <span id="importModeReplaceLabel"></span></label>
    </div>
    <div id="importStatus" class="import-status" hidden></div>
    <div class="modal-actions">
      <button type="button" id="ieCancelBtn" class="btn btn-ghost"></button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
