<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="themeColorMeta" name="theme-color" content="#F5F7FA">
<title>Голосовые задачи 2</title>

<link rel="icon" href="icon-next.svg" type="image/svg+xml">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Голосовые задачи 2</h1>
  <div class="tabs">
    <button class="tab active" data-view="active">Активные</button>
    <button class="tab" data-view="done">Выполненные</button>
  </div>
  <div class="langRow">
    <button class="langBtn" data-lang="ru">RU</button>
    <button class="langBtn" data-lang="uk">UA</button>
    <button class="langBtn" data-lang="en">EN</button>
  </div>
</header>

<div id="doneToolbar" class="doneToolbar hidden">
  <button id="deleteAllDoneBtn" class="deleteAllDoneBtn" type="button">Удалить все выполненные</button>
</div>
<main id="list" class="list"></main>

<p id="empty" class="empty hidden">Пока пусто. Скажите или напишите задачу ниже.</p>

<footer class="inputbar">
  <button id="micBtn" class="mic" title="Голосовой ввод" aria-label="Голосовой ввод">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input id="textInput" type="text" placeholder="Например: завтра в 10 утра гараж" autocomplete="off">
  <button id="sendBtn" class="send" title="Добавить" aria-label="Добавить">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
  </button>
</footer>

<div id="toast" class="toast hidden"></div>

<!-- Edit / move modal -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">Редактировать задачу</h2>
    <label class="field">
      <span>Текст</span>
      <input id="editText" type="text">
    </label>
    <label class="field">
      <span>Дата</span>
      <input id="editDate" type="date">
    </label>
    <label class="field">
      <span>Время (необязательно)</span>
      <input id="editTime" type="time">
    </label>
    <div id="alarmEditor" class="alarmEditor hidden">
      <button id="alarmToggleBtn" type="button" class="alarmToggleBtn">⏰ Активировать будильник</button>
      <p class="alarmHint">Будильник сработает в дату и время задачи.</p>
    </div>
    <div class="modalActions">
      <button id="modalCancel" class="btnGhost">Отмена</button>
      <button id="modalSave" class="btnPrimary">Сохранить</button>
    </div>
  </div>
</div>

<div id="confirmAllDoneOverlay" class="overlay hidden">
  <div class="modal small">
    <h2>Удалить все выполненные?</h2>
    <p class="confirmText">Все выполненные задачи будут удалены. Действие нельзя отменить.</p>
    <div class="modalActions">
      <button id="confirmAllDoneCancel" class="btnGhost">Отмена</button>
      <button id="confirmAllDoneDelete" class="btnDanger">Удалить все</button>
    </div>
  </div>
</div>

<div id="confirmOverlay" class="overlay hidden">
  <div class="modal small">
    <h2>Удалить задачу?</h2>
    <p class="confirmText">Действие нельзя отменить.</p>
    <div class="modalActions">
      <button id="confirmCancel" class="btnGhost">Отмена</button>
      <button id="confirmDelete" class="btnDanger">Удалить</button>
    </div>
  </div>
</div>

<!-- theme switch + header menu for export/import -->
<button id="themeBtn" class="themeBtn" aria-label="Переключить тему" title="Переключить тему">☾</button>
<button id="menuBtn" class="menuBtn" aria-label="Меню">⋮</button>
<div id="menu" class="menu hidden">
  <button id="exportBtn">Экспорт в файл</button>
  <button id="importBtn">Импорт из файла</button>
  <input id="importFile" type="file" accept="application/json" class="hidden">
  <div id="versionInfo" class="versionInfo" aria-label="Версия приложения"></div>
</div>

<script src="app.js"></script>
</body>
</html>
